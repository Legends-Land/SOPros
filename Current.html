
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOPros Operator Guide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0A1526;--bg2:#0E1F38;--accent:#2563EB;--accent-soft:rgba(37,99,235,0.13);--glass:rgba(30,58,95,0.22);--line:rgba(148,176,214,0.16);--ink:#EAF1FB;--dim:#9DB0CC;--faint:#5E718F;--ease:cubic-bezier(0.16,1,0.3,1);}
body{background:var(--bg);font-family:'Inter',-apple-system,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.role-bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;background:rgba(10,21,38,0.90);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 12px;}
.brand{display:flex;align-items:center;gap:8px;margin-right:12px;flex-shrink:0;}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2563EB,#1E3A5F);display:flex;align-items:center;justify-content:center;border:1px solid rgba(148,176,214,0.25);}
.brand-mark svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.brand-name{font-size:13px;font-weight:800;color:#fff;letter-spacing:-0.01em;}
.div{width:1px;height:18px;background:var(--line);margin:0 6px;}
.rtab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s var(--ease);border:1px solid transparent;color:var(--dim);background:none;white-space:nowrap;}
.rtab:hover{color:var(--ink);background:var(--glass);}
.rtab.active{color:#fff;background:var(--glass);border-color:var(--line);}
.rtab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sidebar{position:fixed;top:52px;left:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:12px 8px;z-index:40;}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.section-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);padding:10px 8px 6px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--dim);transition:all .15s;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{color:var(--ink);background:var(--accent-soft);}
.nav-item.active{color:var(--ink);background:var(--accent-soft);font-weight:600;}
.nav-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0.7;}
.main{margin-left:220px;padding-top:52px;min-height:100vh;}
.content{padding:32px 36px 80px;max-width:820px;}
.page-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:10px;}
.page-title{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-bottom:12px;}
.page-desc{font-size:14px;color:var(--dim);line-height:1.7;margin-bottom:24px;max-width:620px;}
.howto-grid{display:flex;flex-direction:column;gap:10px;}
.howto-card{display:flex;align-items:center;gap:14px;background:rgba(14,31,56,0.6);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;transition:all .18s var(--ease);}
.howto-card:hover{border-color:rgba(37,99,235,0.4);background:rgba(37,99,235,0.06);transform:translateX(2px);}
.howto-card .num{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent);flex-shrink:0;}
.howto-card .label{font-size:14px;font-weight:600;flex:1;color:var(--ink);}
.howto-card .chev{color:var(--faint);flex-shrink:0;}
.howto-card .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.overlay{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,0.45);}
.overlay.show{display:block;}
.step-panel{position:fixed;top:0;right:0;bottom:0;width:500px;max-width:100vw;z-index:80;background:var(--bg2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;overflow:hidden;}
@media (min-width:1200px){.step-panel{width:min(72vw,1100px);}.step-panel-body{padding:30px 36px;}.step-panel-head{padding:24px 36px 18px;}.step-panel-title{font-size:20px;}}
@media (max-width:700px){.step-panel{width:100vw;}.step-panel-body{padding:20px;}.step-panel-head{padding:16px 18px 14px;}}
.step-panel.open{transform:translateX(0);}
.step-panel-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:flex-start;gap:12px;}
.step-panel-close{width:30px;height:30px;border-radius:8px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:2px;}
.step-panel-close svg{width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.step-panel-info{flex:1;}
.step-panel-kicker{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
.step-panel-title{font-size:17px;font-weight:700;line-height:1.3;color:var(--ink);}
.step-panel-body{flex:1;overflow-y:auto;padding:24px;}
.step-panel-body::-webkit-scrollbar{width:4px;}
.step-panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.step-item{display:flex;gap:14px;margin-bottom:20px;}
.step-num{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);}
.step-text{font-size:14px;line-height:1.65;color:var(--dim);padding-top:4px;}
.note-box{background:rgba(37,99,235,0.08);border:1px solid rgba(37,99,235,0.22);border-radius:10px;padding:12px 16px;margin-top:4px;font-size:13px;color:var(--dim);line-height:1.6;}
.screen-shot{border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.screen-shot img{width:100%;display:block;}

/* ── SLIDESHOW MODAL ─────────────────────────────── */
.ss-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);}
.ss-overlay.open{display:flex;align-items:center;justify-content:center;}
.ss-modal{
  width:min(960px,94vw);max-height:94vh;background:#0E1F38;
  border:1px solid rgba(148,176,214,0.18);border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
}
.ss-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid rgba(148,176,214,0.12);flex-shrink:0;
}
.ss-header-left{display:flex;flex-direction:column;gap:2px;}
.ss-eyebrow{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5E718F;}
.ss-title{font-size:15px;font-weight:700;color:#EAF1FB;}
.ss-close{
  width:30px;height:30px;border-radius:8px;background:rgba(30,58,95,0.4);
  border:1px solid rgba(148,176,214,0.15);cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
}
.ss-close svg{width:14px;height:14px;stroke:#9DB0CC;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ss-body{display:flex;flex:1;min-height:0;overflow:hidden;}
.ss-sidenav{width:210px;flex-shrink:0;border-right:1px solid rgba(148,176,214,0.12);padding:12px 8px;overflow-y:auto;}
.ss-step-btn{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;transition:all .12s;
}
.ss-step-btn:hover{background:rgba(255,211,61,0.06);}
.ss-step-btn.ss-active{background:rgba(255,211,61,0.10);}
.ss-step-btn.ss-done{opacity:0.7;}
.ss-snum{
  width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;
  background:rgba(255,211,61,0.12);color:#FFD33D;transition:all .12s;
}
.ss-step-btn.ss-active .ss-snum{background:#FFD33D;color:#0A1526;}
.ss-step-btn.ss-done .ss-snum{background:#2DD4BF;color:#0A1526;}
.ss-slabel{font-size:11px;font-weight:500;color:#9DB0CC;line-height:1.3;}
.ss-step-btn.ss-active .ss-slabel{color:#EAF1FB;font-weight:600;}
.ss-viewer{flex:1;display:flex;flex-direction:column;min-width:0;}
.ss-imgwrap{flex:1;background:#050e1a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;min-height:0;}
.ss-img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .2s ease;}
.ss-img.ss-fade{opacity:0;}
.ss-badge{position:absolute;top:10px;left:10px;background:#FFD33D;color:#0A1526;font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;pointer-events:none;}
.ss-controls{padding:10px 16px;border-top:1px solid rgba(148,176,214,0.12);border-bottom:1px solid rgba(148,176,214,0.12);display:flex;align-items:center;gap:8px;flex-shrink:0;background:#0A1526;}
.ss-cbtn{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(148,176,214,0.15);background:rgba(14,31,56,0.8);color:#9DB0CC;transition:all .13s;white-space:nowrap;}
.ss-cbtn:hover:not(:disabled){color:#EAF1FB;border-color:rgba(148,176,214,0.35);}
.ss-cbtn:disabled{opacity:0.3;cursor:not-allowed;}
.ss-cbtn.ss-gold{background:#FFD33D;color:#0A1526;border-color:#FFD33D;}
.ss-cbtn.ss-gold:hover{background:#ffe06b;}
.ss-cbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ss-prog{flex:1;height:3px;background:rgba(148,176,214,0.10);border-radius:3px;overflow:hidden;}
.ss-progbar{height:100%;background:#FFD33D;border-radius:3px;transition:width .3s ease;}
.ss-ctr{font-size:11px;font-weight:600;color:#5E718F;}
.ss-dots{display:flex;gap:4px;}
.ss-dot{width:6px;height:6px;border-radius:50%;background:rgba(148,176,214,0.2);cursor:pointer;border:none;transition:all .18s;}
.ss-dot.ss-active{background:#FFD33D;transform:scale(1.3);}
.ss-dot.ss-done{background:#2DD4BF;}
.ss-desc{padding:12px 18px;flex-shrink:0;}
.ss-dstep{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FFD33D;margin-bottom:4px;}
.ss-dtitle{font-size:14px;font-weight:700;color:#EAF1FB;margin-bottom:5px;}
.ss-dtext{font-size:12px;color:#9DB0CC;line-height:1.65;max-width:580px;}

/* Slideshow trigger button on howto cards */
.ss-trigger{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;
  background:rgba(255,211,61,0.12);color:#FFD33D;border:1px solid rgba(255,211,61,0.25);
  cursor:pointer;margin-left:8px;flex-shrink:0;transition:all .15s;
}
.ss-trigger:hover{background:rgba(255,211,61,0.22);}
.ss-trigger svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.screen-shot-caption{padding:8px 14px;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;background:rgba(14,31,56,0.6);}

.walk-eye{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#FFD33D;background:rgba(255,211,61,0.10);border:1px solid rgba(255,211,61,0.28);flex-shrink:0;}
.walk-eye svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.walk-eye.muted{color:var(--faint);background:transparent;border-color:rgba(148,176,214,0.18);}

.video-camera{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#60A5FA;background:rgba(59,130,246,0.12);border:1px solid rgba(96,165,250,0.32);flex-shrink:0;}
.video-camera svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-item .video-camera{margin-left:auto;width:20px;height:20px;border-radius:6px;}
.nav-item .video-camera svg{width:12px;height:12px;}
.section-media-icons{display:flex;align-items:center;gap:6px;flex-shrink:0;}

</style>
</head>

  'owner:Dashboard': 'The main hub providing a bird\'s-eye view of the entire organization. Displays KPI cards (active locations, total employees, active venues, inactive locations), location performance panel, manager overview, SOP compliance tracker, location exceptions panel, and linked venues.',

      {name:'Res. Checklist',imgKey:'owner:Res. Checklist',icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',items:[]},
      {name:'Prep & Order',imgKey:'owner:Prep & Order',icon:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',items:[
        {title:'View the Order Guide',steps:['Navigate to the Prep & Order Automation tab.','Click the Order Guide section.','Review your current ordering information, including Guide Items, Items to Order, Low Stock Alerts, and Exported Roles.','Review the list of restaurants associated with each status to monitor order progress and inventory needs.']},
        {title:'View Inventory Items',steps:['Navigate to the Prep & Order Automation tab.','Select the Inventory section.','Scroll down to the Inventory Item Count section.','Click the Inventory Items button.','Review the available inventory items and their associated information.']},
        {title:'View Prep Items',steps:['Navigate to the Prep & Order Automation tab.','Select the Inventory section.','Scroll down to the Inventory Item Count section.','Click the Prep Items button.','Review all available prep items and their associated information.']},
        {title:'Download Inventory or Prep CSV Files',steps:['Navigate to the Prep & Order Automation tab.','Select the Inventory section.','Choose either Inventory Items or Prep Items.','Scroll down to the Inventory Options section.','Click the appropriate Download CSV button.','The selected CSV file will automatically download to your device.']},
        {title:'View Prep Lists',steps:['Navigate to the Prep & Order Automation tab.','Click the Prep List section.','Review the prep list for the selected day.','View the required prep items and their quantities.','Click Print to print the prep list for kitchen or prep station use.']},
        {title:'Upload Historical Data',steps:['Navigate to the Prep & Order Automation tab.','Click the Forecast section.','Under the 7-Day Forecast / Historical Data section, click the Upload File button.','Select the historical data file from your computer.','Once the file has finished uploading, click Generate 7-Day Forecast.','The system will use the uploaded historical data to generate the 7-day forecast.']},
        {title:'View Your Order List',steps:['Navigate to the Prep & Order tab.','Scroll down to the Order List section.','Click the Order List button.','Review the available inventory items and their ordering information.','Review the Inventory Item, Vendor, Zone, Item Code, Pack, Purchase Unit, Live Count, and Guide Par columns.','Use this page to review inventory ordering information before placing or generating orders.'],note:'The Order List displays inventory information for the currently selected restaurant. If you do not see the expected items, verify that the correct restaurant is selected.'},
        {title:'View Historical Submission Data',steps:['Navigate to the Prep & Order Automation tab.','Click the Prep List section.','Select the date you would like to review.','Click the Lookup button on the right-hand side of the page.','Review the historical submission data and prep list submission status for the selected date.'],note:'Historical submission data is only available for dates that have previously been submitted. If no results are displayed, verify that the correct date and restaurant are selected.'},
        {title:'Replace or Delete Historical Data',steps:['Navigate to the Prep & Order Automation tab.','Click the Forecast section.','Scroll down to the 7-Day Forecast / Historical Data section.','To replace the current file, click Replace File, select the new file from your computer, and allow it to replace the existing historical data.','To delete the current file, click the Trash icon on the right-hand side and confirm the deletion if prompted.','The selected historical data file will be replaced or removed based on your action.'],note:'Replacing or deleting historical data will affect forecasting calculations that rely on past sales information. Verify that you are updating the correct restaurant before making changes.'}
      ]},
      {name:'Recipes',imgKey:'owner:Recipes',icon:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',items:[
        {title:'View Recipes',steps:['Navigate to the Recipes tab.','Select one of the available recipe categories: All, Prep Items, Menu Items, or Base Recipes.','Browse the list of recipes or use the Search bar to quickly locate a specific recipe.','Click the recipe you would like to view.','Review the recipe details, including Ingredients, Preparation Steps, and Recipe Information.']}
      ]},
      {name:'Inventory Guide',imgKey:'owner:Inventory Guide',icon:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>',items:[]},
      {name:'Spoilage',imgKey:'owner:Spoilage',icon:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',items:[
        {title:'View Spoilage',steps:['Navigate to the Spoilage tab.','Once the page opens, you will see the Spoilage Dashboard.','From this page, you can view, track, and manage food waste across all locations.']},
        {title:'Submit Spoilage',steps:['Navigate to the Spoilage tab.','At the top of the page, complete the spoilage form: Type, Item, Brand, Reason, Tag Type, Quantity, Unit.','Upload a photo of the spoiled item (optional).','Review the information for accuracy.','Click Submit to save the spoilage entry.']},
        {title:'Search for a Spoilage Item',steps:['Navigate to the Spoilage tab.','Scroll down to the Search section.','Use one or more filters: Ingredient, Tag, Reason, Brand, Unit, Photo, or Date Range.','Enter your desired search criteria.','Matching spoilage records will automatically be displayed.']},
        {title:'Export Spoilage to CSV',steps:['Navigate to the Spoilage tab.','Scroll down to the Spoilage Entries section.','Click the Export button on the right-hand side of the page.','A CSV file containing all spoilage entries will automatically download to your device.']}
      ]},

  admin:{
    color:'#A78BFA',
    desc:'Platform-level management. Add locations and venues, manage the employee directory, invite users, change roles, and configure organization settings.',
    sections:[
      {name:'Dashboard',imgKey:'admin:Dashboard',icon:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',items:[
        {title:'Add a Location',steps:['Navigate to the Dashboard tab.','Click the Add Location button.','Complete the required information in the location form.','Review the information for accuracy.','Click the Create Location button.','The new location will now be added to your organization.']},
        {title:'Add a Venue',steps:['Navigate to the Dashboard tab.','Click the Add Venue button.','Complete the required information in the venue form.','Review the information for accuracy.','Click the Create Venue button.','The new venue will now be added to your organization.']},
        {title:'Export Dashboard Data',steps:['Navigate to the Dashboard tab.','Click the Export button.','The dashboard data will automatically download to your device.']},
        {title:'View Organization Employees',steps:['Navigate to the Dashboard tab.','Scroll down to the Organization Employees section.','Click the Open Employee Directory button.','From the Employee Directory, you can view: Total Members, Active Members, Owners, Admins, Managers, and Employees.','Use the available filters to search employees by Name, Email Address, Location, or Role.']},
        {title:'Edit a Linked Venue',steps:['Navigate to the Dashboard.','Scroll down to the Linked Venues section.','Click Linked Venues to view the list of venues.','Locate the venue you want to edit.','Click the Edit Venue button (pencil icon) on the left-hand side.','Update any of the following: Venue Name, Venue Type, Time Zone, Address, City, State.','Review your changes for accuracy.','Click the Save Venue button.','The venue information will be updated automatically.']}
      ]},
      {name:'Locations',imgKey:'admin:Locations',icon:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',items:[
        {title:'Edit a Restaurant Overview',steps:['Navigate to the Restaurant Overview section.','Select the restaurant you would like to edit.','Update the information as needed: Restaurant Title, Venue Location, Service Type, Status, Date Created, Restaurant Color.','Click the Save button to apply your changes.']},
        {title:'Change an Employee or Manager Role',steps:['Navigate to the Restaurant Overview section.','Scroll down to the Employees & Managers section.','Locate the employee or manager whose role you want to update.','Click the Role dropdown next to their name.','Select the new role: Manager, Lead, or Employee.','Once a new role is selected, the change is automatically saved.']},
        {title:'Add a Prep Item',video:'assets/videos/prep_item_management.webm',steps:['Navigate to the Dashboard.','Scroll down to the Locations section.','Select the desired location.','On the left-hand side, click Prep Item Management.','Click the Add Prep Item button.','Complete the required prep item information:','Prep Item Name','Assigned Recipe','Prep Item Type','Production Mode','Description (optional)','Review the information for accuracy.','Click Add Prep Item.','The new prep item will automatically appear in the Prep Items list.']},
        {title:'Import Prep Items',video:'assets/videos/import_prep_items.webm',steps:['Navigate to the Dashboard tab.','Scroll down to the Locations section.','Click the restaurant where you want to import prep items.','On the left-hand side of the page, scroll down and click Prep Item Management.','Scroll down to the Import Prep Items section.','Click Choose File.','Select the prep item file you would like to upload from your computer.','Once the file has been selected, click Import Prep Items.','Wait for the import to complete.','Review the Prep Item Management list to confirm the prep items were imported successfully.'],note:'Make sure you are working in the correct restaurant before importing.'},
        {title:'Edit a Prep Item',video:'assets/videos/admin_edit_prep_items.webm',steps:['Navigate to Prep Item Management.','Scroll through the Prep Items list until you locate the item you want to edit.','Click the Edit button for the desired prep item.','Update any of the following information as needed:','Prep Item Name','Assigned Recipe','Prep Item Type','Production Mode','Status (Activate or Deactivate the prep item)','Description','Review your changes for accuracy.','Click the Save Changes button.','Your updates will be saved, and the prep item information will be updated automatically.']}
      ]},
      {name:'Live Checklist',icon:'<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',items:[
        {title:'View Live Checklists',steps:['Navigate to the Live Checklists tab.','Once the page opens, you will see a list of all active checklists.','Review the information: Checklist Activity, Scheduled Task, Status, Assigned To, Completed By.','Use this page to monitor checklist progress and track task completion.']}
      ]},
      {name:'Planner',imgKey:'admin:Planner',icon:'<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',items:[
        {title:'Assign a Checklist to a Shift',video:'assets/videos/admin_planner_assign_checklist_to_shift.webm',steps:['Navigate to the Planner tab.','Select the shift you want to assign a checklist to.','Click the Add Checklist drop-down.','Select the desired checklist.','Click the Add Checklist button.','The checklist will now be assigned to the selected shift.'],note:'The shift must already be created before assigning a checklist.'},
        {title:'Submit a Checklist to a Role',video:'assets/videos/admin_planner_submit_checklist_to_role.webm',steps:['Navigate to the Planner tab.','Select the shift you want to assign a checklist to.','Click the Add Checklist drop-down.','Select the desired checklist.','Click the Add Checklist button.','Click the Role button.','Select the role you want to assign the checklist to.','Click the Submit Shift button in the upper-right corner.','The checklist will now be assigned to the selected role for the shift.']},
        {title:'Create a Shift',video:'assets/videos/admin_planner_create_shift.webm',steps:['Navigate to the Planner tab.','Select the desired date at the top of the page.','Scroll down to the Restaurant Shift Library section.','Enter the following information:<ul><li>Shift Name</li><li>Opening Time</li><li>Closing Time</li></ul>','Click the Save Shift button.','The new shift will now appear on the Planner page.']},
        {title:'Delete a Shift',steps:['Navigate to the Planner tab.','Scroll down to the Restaurant Shift Library section.','Locate the shift you want to delete.','Click the Delete button.','Confirm the deletion if prompted.','The shift will be permanently removed.']},
        {title:'Edit a Shift',steps:['Navigate to the Planner tab.','Scroll down to the Restaurant Shift Library section.','Locate the shift you want to edit.','Click the Edit button.','Update the shift name, opening time, or closing time.','Click the Save button.','The shift will now be updated.']},
        {title:'Add a Job Role',steps:['Navigate to the Planner tab.','Scroll down to the Restaurant Role Library section.','Enter the new job role.','Click the Add button.','The new job role will be added to the role library.']},
        {title:'Assign a Job Role to a Shift',video:'assets/videos/admin_planner_add_role_to_shift.webm',steps:['Navigate to the Planner tab.','Scroll down to the Day Planner section.','Select the shift you want to update.','Click the Role button.','Select the desired job role.','Click Save.','The selected job role will now be assigned to the shift.']},
        {title:'Add a Note to a Shift',steps:['Navigate to the Planner tab.','Scroll down to the Day Planner section.','Select the shift you want to update.','Click the Notes button.','Enter your note.','Click Save.','The note will now be saved to the shift.']},
        {title:'Remove a Checklist from a Shift',steps:['Navigate to the Planner tab.','Scroll down to the Day Planner section.','Select the shift.','Click the Remove button next to the checklist.','Confirm the removal when prompted.','The checklist will be removed from the shift.']},
        {title:'Edit Shift Tasks',steps:['Navigate to the Planner tab.','Scroll down to the Day Planner section.','Select the shift you want to edit.','Click the Edit Task button.','Update one or more of the following:<ul><li>Assigned Employee</li><li>Job Role</li><li>Due Time</li><li>Skip Task for a specific day</li></ul>','Click Save Task Plan.','The task updates will now be saved.']},
        {title:'Assign an Employee, Job Role, or Due Time Override',steps:['Navigate to the Planner tab.','Scroll down to the Day Planner section.','Select the shift you want to edit.','Click the Edit Task button.','Assign an employee, update the job role, or set a due time override.','Click Save Task Plan.','Your changes will now be saved.']},
        {title:'View Recurring Schedules',steps:['Navigate to the Planner tab.','Click the Recurring Schedules button at the top of the page.','View all recurring shifts scheduled for each day of the week.']},
        {title:'Add a Recurring Shift',steps:['Navigate to the Planner tab.','Click Recurring Schedules.','Select the day or days you want the shift to repeat.','Scroll down to the Shift Recurring Templates section.','Click the Add Shift drop-down.','Select the desired shift.','Click the Add Shift button.','The shift will now recur on the selected day or days.']},
        {title:'Add a Checklist to a Recurring Shift',video:'assets/videos/admin_planner_add_checklist_to_recurring_shift.webm',steps:['Navigate to the Planner tab.','Click Recurring Schedules.','Select the day or days you want the checklist to recur on.','Scroll down to the Shift Recurring Templates section.','Add the recurring shift if it has not already been created.','Click the Select Checklist drop-down.','Choose the desired checklist.','Click the Add button.','The checklist will now be assigned to the recurring shift.']},
        {title:'Delete a Checklist from a Recurring Shift',steps:['Navigate to the Planner tab.','Click Recurring Schedules.','Select the recurring day.','Scroll down to the recurring shift.','Click the Delete button.','The checklist will be removed from the recurring shift.']},
        {title:'Delete a Recurring Shift',video:'assets/videos/admin_planner_delete_recurring_shift.webm',steps:['Navigate to the Planner tab.','Click Recurring Schedules.','Select the recurring day.','Scroll down to the recurring shift.','Click the Remove Shift button.','The recurring shift will be removed.']},
        {title:'Edit a Recurring Shift Checklist',video:'assets/videos/admin_planner_edit_recurring_checklist_shift.webm',steps:['Navigate to the Planner tab.','Click Recurring Schedules.','Select the recurring day.','Scroll down to the recurring shift.','Click the Details button.','Update any of the following:<ul><li>Job Role</li><li>Start Date</li><li>End Date</li><li>Active Checklist</li></ul>','Your changes will be saved automatically.']},
        {title:'Add Notes to a Recurring Shift Checklist',video:'assets/videos/admin_planner_add_notes_recurring_shift_checklist.webm',steps:['Navigate to the Planner tab.','Click Recurring Schedules.','Select the recurring day.','Scroll down to the recurring shift.','Click the Details button.','Enter your notes in the Notes section.','Notes are saved automatically.']},
        {title:'Activate or Deactivate a Recurring Shift Checklist',video:'assets/videos/admin_planner_activate_deactivate_recurring_shift_checklist.webm',steps:['Navigate to the Planner tab.','Click Recurring Schedules.','Select the recurring day.','Scroll down to the recurring shift.','Click the Details button.','Check the Active Weekly Rule checkbox to activate the recurring shift checklist.','Uncheck the Active Weekly Rule checkbox to deactivate the recurring shift checklist.','Your changes will be saved automatically.']}
      ]},
      {name:'Tasks',imgKey:'admin:Tasks',icon:'<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',items:[
        {title:'Create a Checklist Manually',steps:['Navigate to the Tasks tab.','Click the Create Checklist button.','Enter the Checklist Name.','Add a task: Title, Description, Input Option, Task Importance, Required status.','Click the Add Task button.','Repeat until all tasks have been added.','Click the Create Checklist button.']},
        {title:'Import Tasks',steps:['Navigate to the Tasks tab.','Click the Choose File button.','Select the task file from your computer.','Click the Upload & Import button.','Once the import is complete, the tasks will be added to the selected restaurant.']},
        {title:'Edit a Checklist',steps:['Navigate to the Tasks tab.','Select the checklist you want to edit.','Click the task you want to update.','Make the desired changes.','Click Save Task button.','Click the Save Checklist button.']},
        {title:'Delete a Checklist',steps:['Navigate to the Tasks tab.','Select the checklist you want to delete.','Click the Delete Checklist button.','Confirm the deletion if prompted.']},
        {title:'Assign a Checklist to Specific Restaurants',steps:['Navigate to the Tasks tab.','Locate and open the checklist you want to update.','Scroll down to the Assigned To section.','Select the restaurant(s) you want the checklist available for.','Deselect any restaurants you no longer want it assigned to.','Click Save Checklist if prompted.'],note:'All restaurants have to be selected for assignment to take effect.'}
      ]},
      {name:'Prep & Order',imgKey:'admin:Prep & Order',icon:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',items:[
        {title:'View the Order Guide',steps:['Navigate to the Prep & Order Automation tab.','Click the Order Guide section.','Review: Guide Items, Items to Order, Low Stock Alerts, Exported Roles, and Restaurant Count Status.']},
        {title:'How to View Inventory Items',steps:['Navigate to the Prep & Order Automation tab.','Select the Inventory section.','Scroll down to the Inventory Item Count section.','Click the Inventory Items button.','Review the available inventory items and their associated information.'],note:'Ensure the correct restaurant is selected so the appropriate inventory items are displayed.'},
        {title:'How to View Prep Items',steps:['Navigate to the Prep & Order Automation tab.','Select the Inventory section.','Scroll down to the Inventory Item Count section.','Click the Prep Items button.','Review all available prep items and their associated information.'],note:'Prep Items display products prepared in advance and used to create menu items.'},
        {title:'View Prep Lists',steps:['Navigate to the Prep & Order Automation tab.','Click the Prep List section.','Review the prep list for the selected day.','Click Print if needed.']},
        {title:'View Historical Submission Data',video:'assets/videos/view_historical_data.webm',steps:['Navigate to the Prep & Order Automation tab.','Click the Prep List section.','Select the date you would like to review.','Click the Lookup button on the right-hand side of the page.','Review the historical submission data for the selected date, including the submission status of the prep list.']},
        {title:'Upload Historical Data',video:'assets/videos/upload_historical_data_trimmed.webm',steps:['Navigate to the Prep & Order Automation tab.','Click the Forecast section.','Under the 7-Day Forecast / Historical Data section, click the Upload File button.','Select the historical data file from your computer.','Once the file has finished uploading, click Generate 7-Day Forecast.','The system will use the uploaded historical data to generate the 7-day forecast.']}
        ,{title:'Replace or Delete Historical Data',steps:['Navigate to the Prep & Order Automation tab.','Click the Forecast section.','Scroll down to the 7-Day Forecast / Historical Data section.','To replace the current historical data file, click the Replace File button.','Select the new file from your computer.','The new file will replace the existing historical data.','To delete the current historical data file, click the Trash icon on the right-hand side of the file.','Confirm the deletion if prompted.','The selected historical data file will be replaced or removed based on your action.']}
      ]},
      {name:'Recipes',imgKey:'admin:Recipes',icon:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',items:[
        {title:'How to View Recipes',steps:['Navigate to the Recipes tab.','Select one of the following recipe categories: All, Prep Items, Menu Items, or Base Recipes.','The recipe list will automatically update to display the selected category.'],note:'💡 If you do not see your desired recipe, prep item, menu item, or base recipe, make sure you have the correct restaurant selected. Only items assigned to the currently selected restaurant will be displayed.'},
        {title:'How to Import Recipes',steps:['Navigate to the Recipes tab.','Click the Import Recipes button.','Select the recipe file from your computer.','Click Upload.','Once the import is complete, the recipes will automatically be added to the recipe library.']},
        {title:'How to Add Custom Mapping',steps:['Navigate to the Recipes tab.','Click Custom Mapping located directly beneath the Recipes tab.','Complete the required custom mapping fields.','Add your desired unit mapping.','Save the custom mapping once all fields are complete.']},
        {title:'How to View Standard Units',steps:['Navigate to the Recipes tab.','The Recipe Library will open automatically.','Click Standard Units located beneath the Recipe Library.','Review the available measurements under Weight, Volume, Count, and Miscellaneous.']},
        {title:'How to Assign or Remove a Recipe from a Restaurant',steps:['Ensure All Restaurants is selected.','Navigate to the Recipes tab.','The Recipe Library will display all available recipes.','Locate the recipe you would like to manage.','Under the recipe, click Assigned To.','A list of available restaurants will appear.','To assign the recipe to a restaurant, check the box next to the desired restaurant.','To remove the recipe from a restaurant, uncheck the box next to that restaurant.','Your changes will be saved automatically.'],note:'💡 Be sure you are viewing All Restaurants before assigning or removing recipes. Only restaurants with a checked box will have access to the selected recipe or menu item.'},
        {title:'Link a New Inventory Item to a Current Recipe',video:'assets/videos/admin_link_current_recipe.webm',steps:['Navigate to the Recipes tab.','Locate the recipe you want to update.','Open the recipe.','Click the Edit button.','Scroll down to the Ingredients section.','Click Add Ingredient.','Enter the Ingredient Name, Quantity, and Unit.','Click the Link Item button on the right-hand side.','Locate the inventory item by typing its name in the Search bar or scrolling through the inventory list.','Select the desired inventory item.','The inventory item will now be linked to the recipe ingredient.','Click Save Recipe to save your changes.'],note:'💡 Linking an inventory item allows SOPros to track inventory usage and recipe costs accurately.'},
        {title:'How to Link a New Inventory Item to a New Recipe',steps:['Navigate to the Recipes tab.','Click the New Recipe button.','Complete the required recipe information, including Recipe Name, Portion Quantity, Prep Time, Cook Time, Dish, and any other required fields.','Scroll down to the Ingredients section.','Click Add Ingredient.','Enter the Ingredient Name, Quantity, and Unit.','Click the Link Item button on the right-hand side.','Locate the inventory item by typing its name in the Search bar or scrolling through the inventory list.','Select the desired inventory item to link it to the ingredient.','Repeat these steps for any additional ingredients.','Click Save Recipe to create the new recipe.'],note:'💡 Link each ingredient to an inventory item whenever possible to support accurate inventory tracking, food-cost calculations, and forecasting.'},
        {title:'Add a New Recipe Manually',steps:['Navigate to the Recipes tab.','Click the New Recipe button.','Complete: Recipe Name, Portion Quantity, Prep Time, Cook Time, Dish.','Complete remaining sections: Ingredients, Recipe Components, Preparation Steps.','Click Save to create the recipe.']},
        {title:'Edit a Recipe',steps:['Navigate to the Recipes tab.','Select the appropriate category.','Locate and open the recipe.','Click the Edit button.','Update the recipe information as needed.','Click Save.']},
        {title:'Delete a Recipe',steps:['Navigate to the Recipes tab.','Select the appropriate category.','Locate and open the recipe.','Click the Delete (Trash) button.','Confirm the deletion when prompted.'],note:'Deleting a recipe cannot be undone.'},
        {title:'Publish a Recipe',steps:['Navigate to the Recipes tab.','Select a category.','Locate and open the recipe.','Click the Publish Item button.','The recipe will now be published and available throughout the system.']}
      ]},
      {name:'Inventory Guide',imgKey:'admin:Inventory Guide',icon:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>',items:[
        {title:'View Inventory Items',steps:['Navigate to the Inventory Guide tab.','Scroll down to the Inventory Items section.','Review: Restaurant, Zone, Vendor, Item, Label, Item Code, Quantity, Unit, Cost, Unit Mapping, and Actions.']},
        {title:'Add an Inventory Item',steps:['Navigate to the Inventory Guide tab.','Click the Add Item button.','Complete all required fields.','Review the information for accuracy.','Click the Add button.']},
        {title:'Add a Vendor',steps:['Navigate to the Inventory Guide tab.','Scroll down to the Vendors section and click Show Vendors.','Click the Add Vendor button.','Enter the vendor information.','Click Save Vendor.']},
        {title:'Delete a Vendor',steps:['Navigate to the Inventory Guide tab.','Scroll down to the Vendors section and click Show Vendors.','Select the vendor you want to delete.','Click the Edit button.','Click the Delete Vendor button.','Confirm the deletion by clicking OK.'],note:'Deleting a vendor cannot be undone.'}

      {name:'Rewards',imgKey:'employee:Rewards',icon:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',items:[
        {title:'View Your Rewards',steps:['Navigate to the Rewards tab.','Review your Rewards Dashboard: Total Gold Stars, Current Streak, Gold Stars Earned Today, Gold Stars Earned This Week, Current Ranking.','View the Leaderboard rankings for: This Week, This Month, All Time.','Scroll down to the Recent Activity section to view your latest Gold Star awards.']}
      ]}
    ]
  }
};

let currentRole='admin';
let currentSection=0;

function svgIcon(p){return`<svg viewBox="0 0 24 24">${p}</svg>`;}

function getSlideKey(role, sectionName, itemTitle){
  if(!HOWTO_SLIDES) return null;
  const titles=[itemTitle];
  if(itemTitle && itemTitle.startsWith('How to ')) titles.push(itemTitle.replace(/^How to /,''));
  if(itemTitle && !itemTitle.startsWith('How to ')) titles.push('How to '+itemTitle);
  for(const t of titles){
    const key=role+':'+sectionName+':'+t;
    if(HOWTO_SLIDES[key]) return key;
  }
  return null;
}
function hasWalkthrough(role, sectionName, itemTitle){return !!getSlideKey(role,sectionName,itemTitle);}
function hasSectionWalkthrough(role, section){return !!(section.items && section.items.some(item=>hasWalkthrough(role, section.name, item.title)));}
function hasSectionVideo(section){return !!(section.items && section.items.some(item=>item.video));}
function eyeIcon(active=true){return `<span class="walk-eye${active?'':' muted'}" title="${active?'Walkthrough available':'No walkthrough yet'}"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></span>`;}

function videoIcon(active=true){return `<span class="video-camera${active?'':' muted'}" title="Video walkthrough available" aria-label="Video walkthrough available"><svg viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14"/><rect x="3" y="6" width="12" height="12" rx="2" ry="2"/></svg></span>`;}


function switchRole(r){
  currentRole=r;currentSection=-1;
  document.querySelectorAll('.rtab').forEach(b=>b.classList.toggle('active',b.dataset.role===r));
  renderSidebar();renderContent();closePanel();
}

function goOverview(){currentSection=-1;renderSidebar();renderContent();closePanel();}

function selectSection(i){currentSection=i;renderSidebar();renderContent();closePanel();}

function renderSidebar(){
  const d=DATA[currentRole],col=d.color;
  const overSVG='<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>';
  let h=`<div class="section-label" style="color:${col}aa">${currentRole.toUpperCase()}</div>`;
  h+=`<button class="nav-item${currentSection===-1?' active':''}" onclick="goOverview()" style="${currentSection===-1?`color:${col}`:''}"><svg viewBox="0 0 24 24" style="width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0.7">${overSVG}</svg>Overview</button>`;
  d.sections.forEach((s,i)=>{
    h+=`<button class="nav-item${i===currentSection?' active':''}" onclick="selectSection(${i})" style="${i===currentSection?`color:${col}`:''}">${svgIcon(s.icon)}<span style="flex:1">${s.name}</span>${hasSectionVideo(s)?videoIcon(true):''}</button>`;
  });
  document.getElementById('sidebar').innerHTML=h;
}

function renderContent(){
  const d=DATA[currentRole],col=d.color;
  if(currentSection===-1){

    let h=`<div class="page-eyebrow" style="color:${col}">${currentRole.charAt(0).toUpperCase()+currentRole.slice(1)} · Overview</div>
      <div class="page-title">${currentRole.charAt(0).toUpperCase()+currentRole.slice(1)} Portal</div>
      <div class="page-desc">${d.desc}</div>`;

    h+=`<div style="margin-bottom:16px;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint)">Sections in this role</div><div style="display:flex;flex-direction:column;gap:8px;">`;
    d.sections.forEach((s,i)=>{
      h+=`<div onclick="selectSection(${i})" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(14,31,56,0.6);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .15s;"
        onmouseover="this.style.borderColor='rgba(37,99,235,0.4)';this.style.transform='translateX(2px)'"
        onmouseout="this.style.borderColor='var(--line)';this.style.transform='none'">
        <div style="width:32px;height:32px;border-radius:8px;background:${col}22;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:${col};fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;">${s.icon}</svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;color:var(--ink)">${s.name}</div>
          <div style="font-size:12px;color:var(--faint)">${s.items&&s.items.length>0?s.items.length+' how-to guide'+(s.items.length>1?'s':''):'Overview only'}</div>
        </div>
        ${hasSectionWalkthrough(currentRole,s)?eyeIcon(true):''}
        ${hasSectionVideo(s)?videoIcon(true):''}
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`;
    });
    h+=`</div>`;
    document.getElementById('content').innerHTML=h;
    return;
  }
  const s=d.sections[currentSection];
  const imgKey=s.imgKey;
  const secDesc=SECTION_DESCS[currentRole+':'+s.name];
  let h=`<div class="page-eyebrow" style="color:${col}">${currentRole.charAt(0).toUpperCase()+currentRole.slice(1)} · ${s.name}</div>
    <div class="page-title">${s.name}</div>`;
  if(secDesc){h+=`<div class="page-desc">${secDesc}</div>`;}
  if(imgKey&&IMGS[imgKey]){
    h+=`<div class="screen-shot" style="margin-bottom:28px;"><div class="screen-shot-caption">${s.name} screen</div><img src="${IMGS[imgKey]}" alt="${s.name}" loading="lazy"></div>`;
  }
  if(s.items&&s.items.length>0){
    h+=`<div style="margin-bottom:14px;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint)">How-to guides</div>`;
    h+=`<div class="howto-grid">`;
    s.items.forEach((item,i)=>{
      h+=`<div class="howto-card" onclick="openPanel(${i})">
        <div class="num" style="background:${col}22;color:${col}">${String(i+1).padStart(2,'0')}</div>
        <div class="label">How to ${item.title}</div>
        ${hasWalkthrough(currentRole,s.name,item.title)?eyeIcon(true):''}
        ${item.video?videoIcon(true):''}
        <div class="chev">${svgIcon('<polyline points="9 18 15 12 9 6"/>')}</div>
      </div>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div style="padding:20px;background:rgba(14,31,56,0.5);border:1px solid var(--line);border-radius:12px;margin-top:8px;">
      <div style="font-size:13px;color:var(--faint);margin-bottom:8px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase">Overview only</div>
      <div style="font-size:14px;color:var(--dim);line-height:1.7">No step-by-step how-to guides are documented for this section. Use the screenshot above to familiarise yourself with the layout.</div>
    </div>`;
  }
  document.getElementById('content').innerHTML=h;
}

function openPanel(idx){
  const d=DATA[currentRole],s=d.sections[currentSection],item=s.items[idx],col=d.color;
  const imgKey=s.imgKey;
  const ssKey = getSlideKey(currentRole,s.name,item.title) || (currentRole+':'+s.name+':'+item.title);
  const hasWalkthrough = ssKey && HOWTO_SLIDES && HOWTO_SLIDES[ssKey];
  document.getElementById('panel-kicker').textContent=`${currentRole.charAt(0).toUpperCase()+currentRole.slice(1)} · ${s.name}`;
  document.getElementById('panel-title').textContent=`How to ${item.title}`;
  let b='';
  if (item.video) {
    b += '<div style="margin-bottom:20px;">'
       + '<div class="screen-shot">'
       + '<div class="screen-shot-caption">Video walkthrough · audio removed</div>'
       + '<video controls muted playsinline style="width:100%;display:block;background:#050e1a;border-radius:0 0 10px 10px;" src="' + item.video + '"></video>'
       + '</div></div>';
  }
  if (hasWalkthrough) {
    const firstSlide = HOWTO_SLIDES[ssKey][0];
    b += '<div style="margin-bottom:20px;">'
       + '<div class="screen-shot" style="cursor:pointer" onclick="openSS(\'' + ssKey + '\', \'' + item.title.replace(/'/g, "\\'") + '\')">'
       + '<div class="screen-shot-caption">Walkthrough preview · Slide 1</div>'
       + '<img src="' + firstSlide.img + '" alt="' + firstSlide.title + '" loading="lazy">'
       + '</div>'
       + '<button class="ss-trigger" style="margin-top:10px;margin-left:0" data-sskey="' + ssKey + '" data-sstitle="' + item.title + '" onclick="openSSFromBtn(this)">'
       + '<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg> Open walkthrough'
       + '</button></div>';
  }
  item.steps.forEach((step,i)=>{
    b+=`<div class="step-item"><div class="step-num" style="background:${col}22;color:${col}">${i+1}</div><div class="step-text">${step}</div></div>`;
  });
  if(item.note){b+=`<div class="note-box"><strong>Note: </strong>${item.note}</div>`;}
  document.getElementById('panel-body').innerHTML=b;
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}


// ── SLIDESHOW LOGIC ──────────────────────────────────────
let ssCur = 0, ssSlides = [];

function openSSFromBtn(btn) {
  openSS(btn.dataset.sskey, btn.dataset.sstitle);
}

function openSS(key, howtoTitle) {
  ssSlides = HOWTO_SLIDES[key] || [];
  if (!ssSlides.length) return;
  document.getElementById('ssEyebrow').textContent = 'Step-by-Step Walkthrough';
  document.getElementById('ssModalTitle').textContent = 'How to ' + howtoTitle;
  // Build sidenav
  const nav = document.getElementById('ssSideNav');
  nav.innerHTML = '';
  const dots = document.getElementById('ssDots');
  dots.innerHTML = '';
  ssSlides.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'ss-step-btn';
    b.innerHTML = `<div class="ss-snum">${i+1}</div><div class="ss-slabel">${s.title}</div>`;
    b.onclick = () => ssRender(i, true);
    nav.appendChild(b);
    const d = document.createElement('button');
    d.className = 'ss-dot';
    d.onclick = () => ssRender(i, true);
    dots.appendChild(d);
  });
  document.getElementById('ssOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  ssRender(0);
}

function closeSS(e) {
  if (e && e.target !== document.getElementById('ssOverlay') && !e.target.closest('.ss-close')) return;
  document.getElementById('ssOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function ssRender(i, fade=false) {
  ssCur = i;
  const s = ssSlides[i], n = ssSlides.length;
  const img = document.getElementById('ssImg');
  if (fade) { img.classList.add('ss-fade'); setTimeout(() => { img.src = s.img; img.classList.remove('ss-fade'); }, 150); }
  else img.src = s.img;
  document.getElementById('ssBadge').textContent = s.step + ' of ' + n;
  document.getElementById('ssProg').style.width = ((i+1)/n*100) + '%';
  document.getElementById('ssCtr').textContent = (i+1) + ' / ' + n;
  document.getElementById('ssDStep').textContent = s.step;
  document.getElementById('ssDTitle').textContent = s.title;
  document.getElementById('ssDText').textContent = s.desc;
  document.getElementById('ssPrev').disabled = i === 0;
  const nb = document.getElementById('ssNext');
  if (i === n-1) { nb.textContent = '✓ Done'; nb.onclick = null; }
  else { nb.innerHTML = 'Next<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="9 18 15 12 9 6"/></svg>'; nb.onclick = () => ssGo(1); }
  document.querySelectorAll('.ss-step-btn').forEach((b,j) => { b.classList.toggle('ss-active',j===i); b.classList.toggle('ss-done',j<i); });
  document.querySelectorAll('.ss-dot').forEach((d,j) => { d.classList.toggle('ss-active',j===i); d.classList.toggle('ss-done',j<i); });
}

function ssGo(d) { const n = ssCur+d; if(n>=0&&n<ssSlides.length) ssRender(n,true); }

document.addEventListener('keydown', e => {
  if (!document.getElementById('ssOverlay').classList.contains('open')) return;
  if (e.key==='ArrowRight') ssGo(1);
  if (e.key==='ArrowLeft') ssGo(-1);
  if (e.key==='Escape') { document.getElementById('ssOverlay').classList.remove('open'); document.body.style.overflow=''; }
});

switchRole('admin');
selectSection(0);

// LEAD PREP & ORDER WALKTHROUGHS ADDED

</script>
<!-- SLIDESHOW MODAL -->
<div class="ss-overlay" id="ssOverlay" onclick="closeSS(event)">
  <div class="ss-modal" onclick="event.stopPropagation()">
    <div class="ss-header">
      <div class="ss-header-left">
        <div class="ss-eyebrow" id="ssEyebrow">How to</div>
        <div class="ss-title" id="ssModalTitle"></div>
      </div>
      <button class="ss-close" onclick="closeSS()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="ss-body">
      <div class="ss-sidenav" id="ssSideNav"></div>
      <div class="ss-viewer">
        <div class="ss-imgwrap">
          <div class="ss-badge" id="ssBadge"></div>
          <img class="ss-img" id="ssImg" src="" alt="">
        </div>
        <div class="ss-controls">
          <button class="ss-cbtn" id="ssPrev" onclick="ssGo(-1)" disabled>
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Prev
          </button>
          <div class="ss-prog"><div class="ss-progbar" id="ssProg"></div></div>
          <span class="ss-ctr" id="ssCtr"></span>
          <div class="ss-dots" id="ssDots"></div>
          <button class="ss-cbtn ss-gold" id="ssNext" onclick="ssGo(1)">
            Next<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="ss-desc">
          <div class="ss-dstep" id="ssDStep"></div>
          <div class="ss-dtitle" id="ssDTitle"></div>
          <div class="ss-dtext" id="ssDText"></div>
        </div>
      </div>
    </div>
  </div>
</div>
